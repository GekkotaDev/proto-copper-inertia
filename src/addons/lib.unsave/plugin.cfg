[plugin]

name="Unsave"
description="UNSAFE resource based save system.

Unsave is both a state management solution and a save system focusing on providing type safe APIs for managing save file data.

This assumes the use of `ResourceFormatSaver` or a third party addon to implement safe resource save and loading."
